# Production compose file — runs on the remote VPS. There is deliberately NO
# `build:` section: production never rebuilds. The dev machine builds and
# pushes a version-tagged image (scripts/release.sh) and the VPS only pulls:
#
#   REGISTRY=<registry>/<namespace> TAG=<VERSION> \
#     docker compose -f docker-compose.prod.yml pull && \
#   REGISTRY=<registry>/<namespace> TAG=<VERSION> \
#     docker compose -f docker-compose.prod.yml up -d
#
# Rollback = rerun with an older TAG. Full procedure:
# ../hoseworld-infra/docs/10-deployment.md (this repo's own
# guides/production-deploy.md still has the pre-hoseworld-infra version of
# this, kept for history).
#
# Hardening (../hoseworld-infra/docs/05-hydrogen.md): no `ports:` — only
# Traefik reaches this, over the shared hoseworld_edge network; runs as
# non-root (Dockerfile's `USER node`); cap_drop/no-new-privileges; healthcheck
# against the /healthz route added in server.ts.
services:
  hoseworld-online:
    image: ${REGISTRY:-hoseworld}/hoseworld-online:${TAG:-latest}
    container_name: hoseworld-online
    restart: unless-stopped
    networks:
      - hoseworld_edge
    expose:
      - "5130"
    volumes:
      # Supplier images live OUTSIDE the image on purpose — the set is still
      # being collected. rsync new files into /srv/hoseworld/media/suppliers/
      # on the VPS and they're served immediately (server.ts express.static
      # reads the mount per-request; no restart, no rebuild).
      - /srv/hoseworld/media:/app/media:ro
    env_file:
      # Production env values (domains, tokens). Kept on the VPS only —
      # never baked into the image, never committed.
      - .env.production
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # 127.0.0.1, not localhost: Node's http.listen(PORT) binds IPv4-only
      # (0.0.0.0), but busybox wget resolving "localhost" inside this
      # Alpine container tries ::1 (IPv6) first and gets connection
      # refused, even though the IPv4 socket is genuinely open and the app
      # is healthy. Confirmed on the real VPS 2026-08-13.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5130/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - traefik.enable=true
      - traefik.docker.network=hoseworld_edge
      - traefik.http.routers.hoseworld-online.rule=Host(`www.hoseworld.co.za`)
      - traefik.http.routers.hoseworld-online.entrypoints=websecure
      - traefik.http.routers.hoseworld-online.tls=true
      - traefik.http.routers.hoseworld-online.middlewares=security-headers@file,local-rate-limit@file
      - traefik.http.services.hoseworld-online.loadbalancer.server.port=5130
      # Throwaway staging router for browser verification during Phase 5
      # testing — same service/container as the www router above, just a
      # second Host rule. Safe to delete these 5 lines (and the matching
      # Cloudflare Tunnel route + Zero Trust Public Hostname entry) once
      # no longer needed; doesn't touch the real www.hoseworld.co.za path.
      - traefik.http.routers.hoseworld-online-staging.rule=Host(`staging.hoseworld.co.za`)
      - traefik.http.routers.hoseworld-online-staging.entrypoints=websecure
      - traefik.http.routers.hoseworld-online-staging.tls=true
      - traefik.http.routers.hoseworld-online-staging.middlewares=security-headers@file,local-rate-limit@file
      - traefik.http.routers.hoseworld-online-staging.service=hoseworld-online

networks:
  hoseworld_edge:
    external: true
